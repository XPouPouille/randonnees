services:
  db:
    image: imresamu/postgis:17-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_IGN_MODE: ${IGN_MODE}
        VITE_IGN_API_KEY: ${IGN_API_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.randonnees.rule=Host(`randonnees.xavierchapouille.ddns.net`)"
      - "traefik.http.routers.randonnees.entrypoints=websecure"
      - "traefik.http.routers.randonnees.tls=true"
      - "traefik.http.routers.randonnees.tls.certresolver=letsencrypt"
      - "traefik.http.services.randonnees.loadbalancer.server.port=80"

networks:
  default: {}
  traefik:
    external: true
    name: frontend

volumes:
  db_data:
  uploads_data:
