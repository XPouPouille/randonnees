server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx défaut = 1 Mo : trop petit pour un upload GPX (traces longues,
    # profil altimétrique détaillé) - provoquait un 413.
    client_max_body_size 20m;

    # Pas de compression par défaut jusqu'ici : /api/hikes (JSON, traces
    # géométriques) et le bundle JS dépassaient les 700 Ko en clair sur le
    # réseau - handicapant sur connexion mobile limitée. gzip seul divise ce
    # genre de payload texte par ~2.5-3x.
    gzip on;
    # Off par défaut pour les réponses proxifiées (nginx est prudent par
    # défaut derrière un proxy) - "any" nécessaire pour que /api/ (proxy_pass
    # vers le backend) soit bien compressé, pas seulement les fichiers statiques.
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    location / {
        try_files $uri /index.html;
    }
}
